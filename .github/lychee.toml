# The link check of docs/links.md (.github/workflows/links.yml)
max_retries = 3
retry_wait_time = 10
timeout = 30
max_concurrency = 4

# 403 and 429 are bot protection or a rate limit: the site is there
accept = ["200..=299", "403", "429"]

# Some sites answer bots differently
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

exclude = [
    # The GitHub editor (in the intro) needs a sign-in
    '^https://github\.com/[^/]+/[^/]+/edit/',
]
