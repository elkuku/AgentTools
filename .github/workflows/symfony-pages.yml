name: GitHub Pages

on:
    push:
        branches: [master]
        paths:
            - 'docs/**'
            - 'web/**'
            - 'app/**'
            - '.github/workflows/symfony-pages.yml'
    # The Ingress events; the site is only built again when they changed
    schedule:
        - cron: '43 4 * * *'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

env:
    EVENTS_URL: https://elkuku.github.io/AgentTools/ingress-events.json

jobs:
    # Publishes web's app:events:fetch as ingress-events.json, which the website reads. When
    # ingress.com fails, the published list stays and the "events-failed" job fails the run.
    events:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        outputs:
            changed: ${{ steps.compare.outputs.changed }}
            failed: ${{ steps.fetch.outcome == 'failure' }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  extensions: mbstring, xml, ctype, iconv, intl, dom, filter, json

            - name: Install dependencies
              uses: php-actions/composer@v6
              with:
                  working_dir: web

            # Starting from it keeps its date when nothing changed
            - name: Get the published list
              run: |
                  mkdir -p "$RUNNER_TEMP/events"
                  curl -fsSL "$EVENTS_URL" -o "$RUNNER_TEMP/events/ingress-events.json" || cp data/ingress-events.json "$RUNNER_TEMP/events/ingress-events.json"
                  cp "$RUNNER_TEMP/events/ingress-events.json" "$RUNNER_TEMP/published.json"

            - name: Gather the events
              id: fetch
              continue-on-error: true
              shell: bash
              run: bin/console app:events:fetch --no-ansi --output="$RUNNER_TEMP/events/ingress-events.json" | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Compare with the published list
              id: compare
              run: |
                  if cmp -s "$RUNNER_TEMP/published.json" "$RUNNER_TEMP/events/ingress-events.json"; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Keep the list for the build
              uses: actions/upload-artifact@v7
              with:
                  name: ingress-events
                  path: ${{ runner.temp }}/events/ingress-events.json

    # A job of its own: a failed "events" would also stop the build of a push
    events-failed:
        needs: events
        if: needs.events.outputs.failed == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Report it
              run: |
                  echo "::error::The Ingress events could not be gathered, the published list stays. See the \"Gather the events\" step of the events job."
                  exit 1

    build:
        needs: events
        # A daily run without new events leaves the site as it is
        if: github.event_name != 'schedule' || needs.events.outputs.changed == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432/tcp
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP with coverage
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: pcov
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, dom, filter, gd, json, pdo

            - name: Install dependencies
              uses: php-actions/composer@v6
              with:
                  working_dir: web

            - name: Install assets
              run: bin/console importmap:install

            - name: Setup test database
              run: |
                  bin/console doctrine:database:create
                  bin/console doctrine:migrations:migrate -n
                  bin/console doctrine:fixtures:load -n
              env:
                  APP_ENV: test
                  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?serverVersion=15&charset=UTF-8

            - name: Generate coverage report
              run: vendor/bin/phpunit --coverage-html docs/coverage --coverage-clover docs/coverage.xml
              env:
                  APP_ENV: test
                  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?serverVersion=15&charset=UTF-8

            - name: Apply dark theme to coverage report
              run: |
                  find docs/coverage -name "*.html" -exec sed -i 's/<html lang="en">/<html lang="en" data-bs-theme="dark">/' {} \;

            # The dev app (com.elkuku.agenttools.dev, next to the release app) for the project page:
            # production server with the server switch, signed with the dev key from the secrets
            - name: Setup JDK
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Build the dev APK
              working-directory: app
              env:
                  DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
                  DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
              run: |
                  echo "$DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.jks"
                  ./gradlew --console=plain assembleDev \
                      -Pgoogle.serverClientId=398877672532-cilhjpvtudu0sn62qrra786ecqu159ff.apps.googleusercontent.com \
                      -Pserver.baseUrl.release=https://agent-tools.elkuku.dev \
                      -Pdev.storeFile="$RUNNER_TEMP/dev.jks" -Pdev.storePassword="$DEV_KEYSTORE_PASSWORD" \
                      -Pdev.keyAlias=agenttools-dev -Pdev.keyPassword="$DEV_KEYSTORE_PASSWORD" \
                      -Pdev.build="${{ github.run_number }}.${GITHUB_SHA::7}"
                  cp app/build/outputs/apk/dev/app-dev.apk ../web/docs/agenttools-dev.apk
                  rm "$RUNNER_TEMP/dev.jks"
                  echo "DEV_APK_VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/dev/output-metadata.json)" >> "$GITHUB_ENV"

            # The documentation (VitePress) with the coverage and the dev APK next to it
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: docs/package-lock.json

            - name: Get the Ingress events
              uses: actions/download-artifact@v8
              with:
                  name: ingress-events
                  path: ${{ runner.temp }}/events

            - name: Build the documentation
              working-directory: docs
              run: |
                  npm ci
                  npm run build
                  cp -r ../web/docs/coverage ../web/docs/agenttools-dev.apk .vitepress/dist/
                  cp "$RUNNER_TEMP/events/ingress-events.json" .vitepress/dist/

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/.vitepress/dist/

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
