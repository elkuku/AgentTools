name: GitHub Pages

on:
    push:
        branches: [master]
        paths:
            - 'docs/**'
            - 'web/**'
            - 'app/**'
            - '.github/workflows/symfony-pages.yml'

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432/tcp
                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP with coverage
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: pcov
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, dom, filter, gd, json, pdo

            - name: Install dependencies
              uses: php-actions/composer@v6
              with:
                  working_dir: web

            - name: Install assets
              run: bin/console importmap:install

            - name: Setup test database
              run: |
                  bin/console doctrine:database:create
                  bin/console doctrine:migrations:migrate -n
                  bin/console doctrine:fixtures:load -n
              env:
                  APP_ENV: test
                  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?serverVersion=15&charset=UTF-8

            - name: Generate coverage report
              run: vendor/bin/phpunit --coverage-html docs/coverage --coverage-clover docs/coverage.xml
              env:
                  APP_ENV: test
                  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?serverVersion=15&charset=UTF-8

            - name: Apply dark theme to coverage report
              run: |
                  find docs/coverage -name "*.html" -exec sed -i 's/<html lang="en">/<html lang="en" data-bs-theme="dark">/' {} \;

            # The dev app (com.elkuku.agenttools.dev, next to the release app) for the project page:
            # production server with the server switch, signed with the dev key from the secrets
            - name: Setup JDK
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Build the dev APK
              working-directory: app
              env:
                  DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
                  DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
              run: |
                  echo "$DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.jks"
                  ./gradlew --console=plain assembleDev \
                      -Pgoogle.serverClientId=398877672532-cilhjpvtudu0sn62qrra786ecqu159ff.apps.googleusercontent.com \
                      -Pserver.baseUrl.release=https://agent-tools.elkuku.dev \
                      -Pdev.storeFile="$RUNNER_TEMP/dev.jks" -Pdev.storePassword="$DEV_KEYSTORE_PASSWORD" \
                      -Pdev.keyAlias=agenttools-dev -Pdev.keyPassword="$DEV_KEYSTORE_PASSWORD" \
                      -Pdev.build="${{ github.run_number }}.${GITHUB_SHA::7}"
                  cp app/build/outputs/apk/dev/app-dev.apk ../web/docs/agenttools-dev.apk
                  rm "$RUNNER_TEMP/dev.jks"
                  echo "DEV_APK_VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/dev/output-metadata.json)" >> "$GITHUB_ENV"

            # The documentation (VitePress) with the coverage and the dev APK next to it
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: docs/package-lock.json

            - name: Build the documentation
              working-directory: docs
              run: |
                  npm ci
                  npm run build
                  cp -r ../web/docs/coverage ../web/docs/agenttools-dev.apk .vitepress/dist/

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/.vitepress/dist/

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
