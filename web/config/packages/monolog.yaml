monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            # Errors and deprecations to Slack, also in prod
            <<: &slack_handlers
                # Errors to Slack (SLACK_ERRORS_CHANNEL, App\Log\SlackLogHandler), the same error at most every 10 minutes
                slack_errors:
                    type: fingers_crossed
                    action_level: error
                    handler: slack_errors_deduplicated
                    # Client errors: bad input, no access, unknown page
                    excluded_http_codes: [400, 403, 404, 405, 422]
                    channels: ["!deprecation", "!event"]
                    buffer_size: 50
                slack_errors_deduplicated:
                    type: deduplication
                    handler: slack
                    # The message with its {placeholders} filled in: compared and posted
                    process_psr_3_messages: true
                    time: 600
                    store: "%kernel.logs_dir%/%kernel.environment%.slack-errors.dedup"
                # Each deprecation to Slack once a day
                slack_deprecations:
                    type: deduplication
                    channels: [deprecation]
                    handler: slack
                    process_psr_3_messages: true
                    deduplication_level: info
                    time: 86400
                    store: "%kernel.logs_dir%/%kernel.environment%.slack-deprecations.dedup"
                slack:
                    type: service
                    id: App\Log\SlackLogHandler
                    nested: true
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.deprecations.json"
                formatter: monolog.formatter.json

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 30
                level: debug
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.deprecations.json"
                formatter: monolog.formatter.json
            <<: *slack_handlers
