framework:
    notifier:
        chatter_transports:
            # Site activity, errors and deprecations, see App\Notifier\ChatSender
            slack: '%env(SLACK_DSN)%'
            telegram: '%env(TELEGRAM_DSN)%'
        texter_transports:
        channel_policy:
            # use chat/slack, chat/telegram, sms/twilio or sms/vonage
            urgent: ['email']
            high: ['email']
            medium: ['email']
            low: ['email']
        admin_recipients:
            - { email: admin@example.com }
