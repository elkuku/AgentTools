    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="g" cx="0.35" cy="0.35" r="0.75"><stop offset="0" stop-color="#7DFF7D"/><stop offset="1" stop-color="#029A02"/></radialGradient>
    <radialGradient id="b" cx="0.65" cy="0.65" r="0.75"><stop offset="0" stop-color="#7CC4FF"/><stop offset="1" stop-color="#0060C0"/></radialGradient>
  </defs>
  <rect x="0" y="0" width="108" height="108" fill="#000"/>
  <!-- Hexagon frame, like Ingress medals -->
  <polygon points="54,23 80.8,38.5 80.8,69.5 54,85 27.2,69.5 27.2,38.5" fill="none" stroke="#59FBEA" stroke-width="2.6" stroke-linejoin="round"/>
