home:
    welcome: Willkommen %name%!
    see_your_stats: Hier sind <a href="%url%">deine Agentenstatistiken</a>.
    icon_alt: AgentTools-Symbol
    lead: >-
        Speichere deine Ingress-Agentenstatistiken und Medaillen und sieh sie an einem Ort.
        Teile deine Statistiken aus Ingress mit der Android-App &mdash; sie speichert sie hier und zeigt sie
        mit deinen Medaillen.
    download: App herunterladen
    my_stats: Meine Agentenstatistiken
    sign_in: Anmelden
    requirements: Android 8.0 oder neuer &middot; Anmeldung mit Google
    app:
        title: Die Android-App
        share:
            title: Aus Ingress teilen
            text: Öffne dein Agentenprofil, wähle <strong>ALL TIME</strong> und teile die Statistiken mit AgentTools. Sie werden sofort gespeichert.
        changes:
            title: Sieh, was sich geändert hat
            text: 'Nach jedem Import zeigt die App, was sich seit dem letzten geändert hat: jede gestiegene Statistik, Medaillen mit einer neuen Stufe und dein neues Level.'
        medals:
            title: Deine Medaillen
            text: Deine neuesten Statistiken mit den Medaillen, die sie bringen, von Bronze bis Onyx &mdash; tippe auf eine Medaille für die Details.
        custom_medals:
            title: Sondermedaillen
            text: 'Anomalie-, Jahres- und Event-Medaillen stehen nicht in den Statistiken: Teile Screenshots deiner Medaillen und die App erkennt sie auf dem Handy. Prüfe sie, dann speichere.'
    web:
        title: Die Website
        stats:
            title: Alle deine Statistiken
            text: Melde dich mit Google an, um jeden mit der App gespeicherten Import zu sehen, die neuesten zuerst, und jeden im Detail anzusehen.
        private:
            title: Standardmäßig privat
            text: Deine ersten Statistiken legen deinen Agentennamen fest; niemand sonst kann Statistiken dafür speichern. Deine Statistiken und Medaillen bleiben privat, bis du in deinem Profil wählst, was andere Agenten sehen.
        api:
            title: Offene API
            text: Die Statistiken werden mit den Spaltennamen der 4e-website gespeichert. In der <a href="%api_docs%">API-Dokumentation</a> kannst du jede Anfrage mit deinem Google-ID-Token ausprobieren.
    start:
        title: Los geht's
        install: '<strong>App installieren:</strong> Lade die APK aus dem <a href="%release%">neuesten Release</a> auf dein Handy herunter und öffne sie.'
        sign_in: <strong>Melde dich mit Google an</strong> in der App. Dein Konto wird sofort angelegt.
        share: <strong>Teile deine All-Time-Statistiken</strong> aus Ingress mit AgentTools &mdash; und Screenshots deiner Medaillen für die Sondermedaillen.
        see: '<strong>Sieh sie überall:</strong> in der App oder hier nach der Anmeldung.'

