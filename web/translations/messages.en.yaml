footer:
    made_with: Made with
    tagline: Ingress agent stats and medals
    android_app: Android app
    api_docs: API docs

home:
    welcome: Welcome %name%!
    see_your_stats: See <a href="%url%">your agent stats</a>.
    icon_alt: AgentTools icon
    lead: >-
        Save your Ingress agent stats and medals and see them in one place.
        Share your stats from Ingress with the Android app &mdash; it stores them here and shows them
        with your medals.
    download: Download the app
    my_stats: My agent stats
    sign_in: Sign in
    requirements: Android 8.0 or newer &middot; Sign in with Google
    app:
        title: The Android app
        share:
            title: Share from Ingress
            text: Open your agent profile, select <strong>ALL TIME</strong> and share the stats with AgentTools. They are saved right away.
        changes:
            title: See what changed
            text: 'After each import the app shows what changed since your last one: every stat that went up, medals that reached a new tier and your new level.'
        medals:
            title: Your medals
            text: Your latest stats with the medals they earn, from bronze to onyx &mdash; tap a medal for its details.
        custom_medals:
            title: Custom medals
            text: 'Anomaly, annual and event medals are not in the stats: share screenshots of your medal grid and the app recognizes them on the phone. Check them, then save.'
    web:
        title: The website
        stats:
            title: All your stats
            text: Sign in with Google to see every import you saved with the app, newest first, and look at each one in detail.
        private:
            title: Private by default
            text: Your first stats set your agent name; no one else can save stats for it. Your stats and medals stay private until you choose on your profile what other agents see.
        api:
            title: Open API
            text: Stats are stored with the column names of 4e-website. The <a href="%api_docs%">API docs</a> let you try every request with your Google ID token.
    start:
        title: Get started
        install: '<strong>Install the app:</strong> download the APK from the <a href="%release%">latest release</a> on your phone and open it.'
        sign_in: <strong>Sign in with Google</strong> in the app. Your account is registered right away.
        share: <strong>Share your all-time stats</strong> from Ingress with AgentTools &mdash; and screenshots of your medals for the custom ones.
        see: '<strong>See them anywhere:</strong> in the app, or here after signing in.'

