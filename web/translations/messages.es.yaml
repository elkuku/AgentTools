home:
    welcome: ¡Hola, %name%!
    see_your_stats: Mira <a href="%url%">tus estadísticas de agente</a>.
    icon_alt: Icono de AgentTools
    lead: >-
        Guarda tus estadísticas y medallas de agente de Ingress y míralas en un solo lugar.
        Comparte tus estadísticas desde Ingress con la app para Android &mdash; las guarda aquí y las muestra
        con tus medallas.
    download: Descargar la app
    my_stats: Mis estadísticas de agente
    sign_in: Iniciar sesión
    requirements: Android 8.0 o superior &middot; Inicio de sesión con Google
    app:
        title: La app para Android
        share:
            title: Compartir desde Ingress
            text: Abre tu perfil de agente, selecciona <strong>ALL TIME</strong> y comparte las estadísticas con AgentTools. Se guardan al instante.
        changes:
            title: Mira qué cambió
            text: 'Después de cada importación la app muestra qué cambió desde la anterior: cada estadística que subió, las medallas que alcanzaron un nuevo nivel y tu nuevo nivel.'
        medals:
            title: Tus medallas
            text: Tus estadísticas más recientes con las medallas que consiguen, de bronce a ónix &mdash; toca una medalla para ver sus detalles.
        custom_medals:
            title: Medallas especiales
            text: 'Las medallas de anomalías, anuales y de eventos no están en las estadísticas: comparte capturas de pantalla de tus medallas y la app las reconoce en el teléfono. Revísalas y luego guárdalas.'
    web:
        title: El sitio web
        stats:
            title: Todas tus estadísticas
            text: Inicia sesión con Google para ver cada importación que guardaste con la app, la más reciente primero, y ver cada una en detalle.
        private:
            title: Privado por defecto
            text: Tus primeras estadísticas fijan tu nombre de agente; nadie más puede guardar estadísticas para él. Tus estadísticas y medallas son privadas hasta que elijas en tu perfil qué ven otros agentes.
        api:
            title: API abierta
            text: Las estadísticas se guardan con los nombres de columna de 4e-website. En la <a href="%api_docs%">documentación de la API</a> puedes probar cada petición con tu token de ID de Google.
    start:
        title: Primeros pasos
        install: '<strong>Instala la app:</strong> descarga el APK de la <a href="%release%">última versión</a> en tu teléfono y ábrelo.'
        sign_in: <strong>Inicia sesión con Google</strong> en la app. Tu cuenta se registra al instante.
        share: <strong>Comparte tus estadísticas de siempre</strong> desde Ingress con AgentTools &mdash; y capturas de tus medallas para las especiales.
        see: '<strong>Míralas donde quieras:</strong> en la app, o aquí después de iniciar sesión.'

