stats_import:
    title: 'Importar estadísticas desde un archivo'
    intro: 'Importa lo que guardaste en 4e-website: allí abre el menú de la cuenta, <strong>Migrate</strong>, luego <strong>Export CSV</strong> para tus estadísticas y <strong>Export custom medals</strong> para tus medallas de anomalías, anuales y de eventos, y sube cada archivo aquí. Las estadísticas que ya tienes se omiten y solo se importan las de tu agente; una medalla especial que ya tienes conserva el nivel más alto.'
    file: Archivo
    file_help: 'Las estadísticas en CSV (una fila de encabezado con los nombres de columna: datetime, nickname, faction, ap, …) o las medallas especiales en JSON.'
